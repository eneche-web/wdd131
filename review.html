<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for submitting your product review. View your review submission confirmation and the total number of reviews submitted from this browser.">
    <meta name="author" content="Eneche John">

    <title>Review Submitted</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/review.js" defer>


        document.addEventListener("DOMContentLoaded", () => {

            const reviews = Number(localStorage.getItem("reviews")) || 0;

            document.querySelector("#reviewCount").textContent = reviews;

            document.querySelector("#year").textContent =
                new Date().getFullYear();

            document.querySelector("#lastModified").textContent =
                `Last Modified: ${document.lastModified}`;
        });
    </script>
</head>

<body>

    <header>
        <h1>Review Submitted</h1>
    </header>

    <main>

        <section class="field">
            <h2>Thank You!</h2>

            <p>
                Your product review has been submitted successfully.
            </p>

            <br>

            <p>
                Reviews submitted from this browser:
                <strong>
                    <span id="reviewCount">0</span>
                </strong>
            </p>

            <br>

            <p>
                <a href="form.html">Submit Another Review</a>
            </p>

        </section>

    </main>

    <footer>
        <p>
            &copy;
            <span id="year"></span>
            | Eneche John
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
