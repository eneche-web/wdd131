<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review by selecting a product, providing a rating, choosing useful features, entering the installation date, and writing your comments.">
    <meta name="author" content="Eneche John">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <div class="field">
                <label for="product">
                    Product Name <span class="required">*</span>
                </label>

                <select id="product" name="product" required>
                    <option value="" selected disabled>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <div class="field">
                <p>Overall Rating <span class="required">*</span></p>

                <label for="one">
                    <input type="radio" id="one" name="rating" value="1" required>
                    ⭐☆☆☆☆
                </label>

                <label for="two">
                    <input type="radio" id="two" name="rating" value="2" required>
                    ⭐⭐☆☆☆
                </label>

                <label for="three">
                    <input type="radio" id="three" name="rating" value="3" required>
                    ⭐⭐⭐☆☆
                </label>

                <label for="four">
                    <input type="radio" id="four" name="rating" value="4" required>
                    ⭐⭐⭐⭐☆
                </label>

                <label for="five">
                    <input type="radio" id="five" name="rating" value="5" required>
                    ⭐⭐⭐⭐⭐
                </label>
            </div>

            <!-- Installation Date -->
            <div class="field">
                <label for="installDate">
                    Date of Installation <span class="required">*</span>
                </label>

                <input
                    type="date"
                    id="installDate"
                    name="installDate"
                    required>
            </div>

            <!-- Useful Features -->
            <div class="field">
                <p>Useful Features (Check all that apply)</p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>

                <label for="easeOfUse">
                    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                    Ease of Use
                </label>
            </div>

            <!-- Written Review -->
            <div class="field">
                <label for="review">
                    Written Review (Optional)
                </label>

                <textarea
                    id="review"
                    name="review"
                    rows="6"></textarea>
            </div>

            <!-- User Name -->
            <div class="field">
                <label for="username">
                    Your Name (Optional)
                </label>

                <input
                    type="text"
                    id="username"
                    name="username">
            </div>

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>
            &copy;
            <span id="year"></span>
            | Eneche John
        </p>

        <p id="lastModified"></p>
    </footer>
</body>
</html>
